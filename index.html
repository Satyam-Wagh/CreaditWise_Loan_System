<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>SecureTrust Bank Credit Wise Loan System</title>
    <style>
        body{
            background-color:rgb(226, 222, 222);
        }
        .head{
            display:block;
            width: 100%;
            background-color: rgb(7, 84, 165);
            text-align: left;
            padding: 10px;
            margin: 0px;
            margin-left: 0px;
            margin-right: 0px;
        }
        .head h1{
            color: white;
        }
        .heading{
            color: rgb(7, 84, 165);
            width: 100%;
            text-align: center;
        }
        .input{
            background-color: white;
            width:80%;
            margin-left:10%;
            padding:2%;
        }
        .input{
            display: none;
        }
        #in_0{
            display:block;
        }
    </style>
    
</head>
<body>
   <div class="head">
    <h1><span class="class="bank-icon">🏦</span>SecureTrust Bank</h1>
   </div>
   <div class="heading"><h2>CreaditWise Loan System</h2>
    </div>
<!--input section 1-->
<div class="input"id="in_0">
    <!--Applicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="0" placeholder="18000">
    <label for="0">Enter Applicant's Income</label>
    </div>
     <!--coapplicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="1" placeholder="Password">
    <label for="1">Enter Coapplicant income</label>
    </div>
     <!--age-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="2" placeholder="age" min="0"max="100">
    <label for="2">Enter age</label>
    </div>
    <!--Dependents-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="3" placeholder="age">
    <label for="3">Enter number of Dependents</label>
    </div>
    <!--Existing loan-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="4" placeholder="age">
    <label for="4">Enter Existing loan</label>
    </div>
     <!--Saving-->
    <div class="form-floating mb-5">
    <input type="number" class="form-control" id="5" placeholder="age">
    <label for="5">Enter Saving</label>
    </div>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="next()">Next</button>
</div>
<!--input section 2-->
<div class="input"id="in_1">
    <!--Collateral value-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="6" placeholder="18000">
    <label for="6">Enter Collateral value</label>
    </div>
     <!--Loan Aamount-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="7" placeholder="Password">
    <label for="7">Enter Loan Aamount</label>
    </div>
     <!--Loan Term-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="8" placeholder="age" min="0"max="100">
    <label for="8">Loan Term</label>
    </div>
    <!--Education level-->
    <select class="form-select" aria-label="Default select example"id="9">
        <option selected value="-1">Education level</option>
        <option value="1">Graduate</option>
        <option value="0">Not Graduate</option>
</select>
    <br>
    <!--Employment status-->
    <select class="form-select" aria-label="Default select example"id="10">
        <option selected value="-1">Employment status</option>
        <option value="1-0-0">Salaried</option>
        <option value="0-1-0">Self-employed</option>
        <option value="0-0-1">Unemployed</option>
</select>
    <br>
     <!--Marital_Status-->
    <select class="form-select" aria-label="Default select example"id="11">
        <option selected value="-1">Marital Status</option>
        <option value="0">Single</option>
        <option value="1">Married</option>
</select>
    <br>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="next()">Next</button>
</div>
<!--input section 3-->
<div class="input"id="in_2">
    <!--Loan Purpose-->
    <select class="form-select" aria-label="Default select example"id="12">
        <option selected value="-1">Loan Purpose</option>
        <option value="1-0-0-0">Car</option>
        <option value="0-1-0-0">Education</option>
        <option value="0-0-1-0">Home</option>
        <option value="0-0-0-1">Personal</option>
</select>
    <br>
    <!--Property_Area-->
    <select class="form-select" aria-label="Default select example"id="13">
        <option selected value="-1">Property Area</option>
        <option value="1-0">Semiurban</option>
        <option value="0-1">Urban</option>
</select>
    <br>
    <!--Gender-->
    <select class="form-select" aria-label="Default select example"id="14">
        <option selected value="-1">Gender</option>
        <option value="1">Male</option>
        <option value="0">Female</option>
</select>
    <br>
<!--Employer Category-->
    <select class="form-select" aria-label="Default select example"id="15">
        <option selected value="-1">Employer Category</option>
        <option value="1-0-0-0">Government</option>
        <option value="0-1-0-0">MNC</option>
        <option value="0-0-1-0">Private</option>
        <option value="0-0-0-1">Unemployed</option>
</select>
    <br>
<!--DTI Ratio-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="16" placeholder="Password">
    <label for="16">Enter DTI Ratio</label>
    </div>
<!--Credit Score-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="17" placeholder="Password">
    <label for="16">Enter Credit Score</label>
    </div>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="submit()">Submit</button>
</div>
</div>
<script>
    var curr=0;
    function validation(slide_id){
        const input= Array.from(document.getElementById(slide_id).getElementsByTagName("input"));
        //cheak for input number fields
       for(var e of input){
            if(e.value===''){
                alert("Please "+e.nextElementSibling.innerText);
                return true;
            }
       }
       // cheak for the select
       const select= Array.from(document.getElementById(slide_id).getElementsByTagName("select"));
        for(var e of select){
            if(e.value==="-1"){
                alert("Please Select "+e.firstElementChild.innerText);
                return true;
            }
       }
    }
    function next(){
        if(validation("in_"+curr)){
            return;
        }
        document.getElementById("in_"+curr).style.display="none";
        curr=(curr+1)%3;
        document.getElementById("in_"+curr).style.display="block";
    }
    function privious(){
        if(curr==0){
            return;
        }
        document.getElementById("in_"+curr).style.display="none";
        curr=(curr-1)%3;
        document.getElementById("in_"+curr).style.display="block";
    }
    function display(output){
        let out=output[0];
        
    }
   function submit() {
    var array = [];

for (var i = 0; i < 18; i++) {
    var input = document.getElementById(`${i}`);

    if (input.tagName === "SELECT") {
        var select = input.value.split("-").map(x=>Number(x));
        array.push(...select);
    } else {
        array.push(Number(input.value));
    }
}
array[26]=array[26]*array[26];
array[26]=array[26]*array[26];
console.log(array);
//fetch
fetch("http://localhost:8000/prediction", {
    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        input: array
    })
})
.then(res => {
    console.log("Status:", res.status);
    return res.json();
})
.then(data => {
    console.log("Python response:", data);
    
})
.catch(error => {
    alert("Error:", error);
});
}
</script>
</script>
</body>
</html>
