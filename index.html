<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>SecureTrust Bank Credit Wise Loan System</title>
    <style>
        body{
            background-color:rgb(226, 222, 222);
        }
        .head{
            display:block;
            width: 100%;
            background-color: rgb(7, 84, 165);
            text-align: left;
            padding: 10px;
            margin: 0px;
            margin-left: 0px;
            margin-right: 0px;
        }
        .head h1{
            color: white;
        }
        .heading{
            color: rgb(7, 84, 165);
            width: 100%;
            text-align: center;
        }
        .input{
            background-color: white;
            width:80%;
            margin-left:10%;
            padding:2%;
        }
        .input{
            display: none;
        }
        #in_1{
            display:block;
        }
    </style>
</head>
<body>
   <div class="head">
    <h1><span class="class="bank-icon">🏦</span>SecureTrust Bank</h1>
   </div>
   <div class="heading"><h2>CreaditWise Loan System</h2>
    </div>
<!--input section 1-->
<div class="input"id="in_1">
    <!--Applicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="applicant_income" placeholder="18000">
    <label for="applicant_income">Enter Applicant's Income</label>
    </div>
     <!--coapplicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="coapplicant_income" placeholder="Password">
    <label for="coapplicant_income">Enter Coapplicant income</label>
    </div>
     <!--age-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="age" placeholder="age" min="0"max="100">
    <label for="age">Enter age</label>
    </div>
    <!--Dependents-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="dependentss" placeholder="age">
    <label for="dependentss">Enter number of Dependents</label>
    </div>
    <!--Existing loan-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="existing_loan" placeholder="age">
    <label for="existing_loan">Enter Existing loan</label>
    </div>
     <!--Saving-->
    <div class="form-floating mb-5">
    <input type="number" class="form-control" id="saving" placeholder="age">
    <label for="saving">Enter Saving</label>
    </div>
   <button type="button" class="btn btn-secondary">Privious</button>
    <button type="button" class="btn btn-primary">Next</button>
</div>
<!--input section 2-->
<div class="input"id="in_2">
    <!--Applicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="applicant_income" placeholder="18000">
    <label for="applicant_income">Enter Applicant's Income</label>
    </div>
     <!--coapplicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="coapplicant_income" placeholder="Password">
    <label for="coapplicant_income">Enter Coapplicant income</label>
    </div>
     <!--age-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="age" placeholder="age" min="0"max="100">
    <label for="age">Enter age</label>
    </div>
    <!--Dependents-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="dependentss" placeholder="age">
    <label for="dependentss">Enter number of Dependents</label>
    </div>
    <!--Existing loan-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="existing_loan" placeholder="age">
    <label for="existing_loan">Enter Existing loan</label>
    </div>
     <!--Saving-->
    <div class="form-floating mb-5">
    <input type="number" class="form-control" id="saving" placeholder="age">
    <label for="saving">Enter Saving</label>
    </div>
   <button type="button" class="btn btn-secondary">Privious</button>
    <button type="button" class="btn btn-primary">Next</button>
</div>
</div>
</body>
</html>
