privious()<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>SecureTrust Bank Credit Wise Loan System</title>
    <style>
        body{
            background-color:rgb(226, 222, 222);
        }
        .head{
            display:block;
            width: 100%;
            background-color: rgb(7, 84, 165);
            text-align: left;
            padding: 10px;
            margin: 0px;
            margin-left: 0px;
            margin-right: 0px;
        }
        .head h1{
            color: white;
        }
        .heading{
            color: rgb(7, 84, 165);
            width: 100%;
            text-align: center;
        }
        .input{
            background-color: white;
            width:80%;
            margin-left:10%;
            padding:2%;
        }
        .input{
            display: none;
        }
        #in_0{
            display:block;
        }
    </style>
    
</head>
<body>
   <div class="head">
    <h1><span class="class="bank-icon">🏦</span>SecureTrust Bank</h1>
   </div>
   <div class="heading"><h2>CreaditWise Loan System</h2>
    </div>
<!--input section 1-->
<div class="input"id="in_0">
    <!--Applicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="applicant_income" placeholder="18000">
    <label for="applicant_income">Enter Applicant's Income</label>
    </div>
     <!--coapplicaant's income-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="coapplicant_income" placeholder="Password">
    <label for="coapplicant_income">Enter Coapplicant income</label>
    </div>
     <!--age-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="age" placeholder="age" min="0"max="100">
    <label for="age">Enter age</label>
    </div>
    <!--Dependents-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="dependentss" placeholder="age">
    <label for="dependentss">Enter number of Dependents</label>
    </div>
    <!--Existing loan-->
    <div class="form-floating mb-2">
    <input type="number" class="form-control" id="existing_loan" placeholder="age">
    <label for="existing_loan">Enter Existing loan</label>
    </div>
     <!--Saving-->
    <div class="form-floating mb-5">
    <input type="number" class="form-control" id="saving" placeholder="age">
    <label for="saving">Enter Saving</label>
    </div>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="next()">Next</button>
</div>
<!--input section 2-->
<div class="input"id="in_1">
    <!--Collateral value-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="collateral_value" placeholder="18000">
    <label for="applicant_income">Enter Collateral value</label>
    </div>
     <!--Loan Aamount-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id=loan_amount" placeholder="Password">
    <label for="coapplicant_income">Enter Loan Aamount</label>
    </div>
     <!--Loan Term-->
     <div class="form-floating mb-2">
    <input type="number" class="form-control" id="loan_term" placeholder="age" min="0"max="100">
    <label for="age">Loan Term</label>
    </div>
    <!--Education level-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Education level</option>
        <option value="Graduate">Graduate</option>
        <option value="Not Graduate">Not Graduate</option>
</select>
    <br>
    <!--Employment status-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Employment status</option>
        <option value="Salaried">Salaried</option>
        <option value="Self-employed">Self-employed</option>
        <option value="Unemployed">Unemployed</option>
</select>
    <br>
     <!--Marital_Status-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Marital Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
</select>
    <br>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="next()">Next</button>
</div>
<!--input section 3-->
<div class="input"id="in_2">
    <!--Loan Purpose-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Loan Purpose</option>
        <option value="Car">Car</option>
        <option value="Education">Education</option>
        <option value="Home">Home</option>
        <option value="Personal">Personal</option>
</select>
    <br>
    <!--Property_Area-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Loan Purpose</option>
        <option value="Semiurban">Semiurban</option>
        <option value="Urban">Urban</option>
</select>
    <br>
    <!--Gender-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
</select>
    <br>
<!--Employer Category-->
    <select class="form-select" aria-label="Default select example">
        <option selected value="1">Employer Category</option>
        <option value="Government">Government</option>
        <option value="MNC">MNC</option>
        <option value="Private">Private</option>
        <option value="Unemployed">Unemployed</option>
</select>
    <br>
<!--DTI Ratio-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="DTI_Ratio" placeholder="Password">
    <label for="coapplicant_income">Enter DTI Ratio</label>
    </div>
<!--Credit Score-->
    <div class="form-floating mb-2">
   <input type="number" class="form-control" id="Credit_Score" placeholder="Password">
    <label for="coapplicant_income">Enter Credit Score</label>
    </div>
   <button type="button" class="btn btn-secondary"onclick="privious()">Privious</button>
    <button type="button" class="btn btn-primary"onclick="next()">Submit</button>
</div>
</div>
<script>
    var curr=0;
    function validation(slide_id){
        const input= Array.from(document.getElementById(slide_id).getElementsByTagName("input"));
        //cheak for input number fields
       for(var e of input){
            if(e.value===''){
                alert("Please "+e.nextElementSibling.innerText);
                return true;
            }
       }
       // cheak for the select
       const select= Array.from(document.getElementById(slide_id).getElementsByTagName("select"));
        for(var e of select){
            if(e.value==="1"){
                alert("Please Select "+e.firstElementChild.innerText);
                return true;
            }
       }
    }
    function next(){
        if(validation("in_"+curr)){
            return;
        }
        document.getElementById("in_"+curr).style.display="none";
        curr=(curr+1)%3;
        document.getElementById("in_"+curr).style.display="block";
    }
    function privious(){
        if(curr==0){
            return;
        }
        document.getElementById("in_"+curr).style.display="none";
        curr=(curr-1)%3;
        document.getElementById("in_"+curr).style.display="block";
    }
</script>
</script>
</body>
</html>
